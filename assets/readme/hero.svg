<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">穿墙透壁 · 上海建筑剖透图册 — 证据型建筑剖透图</title>
  <desc id="desc">暖纸底标题：穿墙透壁，副标题把上海一层一层地看清；右侧是一座剖开的高楼，左侧深色墨线是实证结构，右侧浅色排线是推断复原。</desc>

  <rect width="1200" height="360" rx="26" fill="#f5efe3"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6e6248">证据型建筑剖透图册 · EVIDENCE-BACKED ATLAS</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#2b2620">穿墙透壁</text>
    <text x="56" y="168" font-size="23" fill="#8f3a26">把上海，一层一层地看清</text>
    <text x="56" y="204" font-size="19" fill="#6b6049">9 幅上海地标剖透图，实色是实证，浅色排线是推断。</text>
    <g id="chips" font-size="18" fill="#3a3226" text-anchor="middle">
      <g><rect x="56" y="238" width="138" height="36" rx="18" fill="#efe7d3" stroke="#d8cbae" stroke-width="1.5"/><text x="125" y="262">9 幅剖透图</text></g>
      <g><rect x="206" y="238" width="168" height="36" rx="18" fill="#efe7d3" stroke="#d8cbae" stroke-width="1.5"/><text x="290" y="262">实证 / 推断双轨</text></g>
      <g><rect x="386" y="238" width="126" height="36" rx="18" fill="#efe7d3" stroke="#d8cbae" stroke-width="1.5"/><text x="449" y="262">证据台账</text></g>
      <g><rect x="524" y="238" width="138" height="36" rx="18" fill="#efe7d3" stroke="#d8cbae" stroke-width="1.5"/><text x="593" y="262">可复用 Skill</text></g>
    </g>
  </g>

  <g id="tower-cutaway">
    <g id="tower-outline" fill="none" stroke="#2b2620" stroke-width="2.5">
      <path d="M 830 312 L 856 56 L 884 40 L 912 56 L 938 312 Z"/>
    </g>
    <g id="floor-lines" stroke="#2b2620" stroke-width="1.5">
      <line x1="834" y1="280" x2="934" y2="280"/>
      <line x1="838" y1="248" x2="930" y2="248"/>
      <line x1="842" y1="216" x2="926" y2="216"/>
      <line x1="846" y1="184" x2="922" y2="184"/>
      <line x1="850" y1="152" x2="918" y2="152"/>
      <line x1="854" y1="120" x2="914" y2="120"/>
      <line x1="857" y1="88" x2="911" y2="88"/>
    </g>
    <g id="inferred-hatch" stroke="#b8a888" stroke-width="1.5">
      <line x1="884" y1="280" x2="900" y2="248"/>
      <line x1="884" y1="248" x2="900" y2="216"/>
      <line x1="884" y1="216" x2="900" y2="184"/>
      <line x1="884" y1="184" x2="900" y2="152"/>
      <line x1="884" y1="152" x2="900" y2="120"/>
      <line x1="884" y1="120" x2="900" y2="88"/>
      <line x1="900" y1="280" x2="916" y2="248"/>
      <line x1="900" y1="248" x2="916" y2="216"/>
      <line x1="900" y1="216" x2="916" y2="184"/>
      <line x1="900" y1="184" x2="916" y2="152"/>
      <line x1="900" y1="152" x2="916" y2="120"/>
      <line x1="900" y1="120" x2="916" y2="88"/>
    </g>
    <g id="legend" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#4a4234">
      <g><circle cx="982" cy="106" r="10" fill="#2b2620"/><text x="1000" y="112">实色 = 实证</text></g>
      <g><circle cx="982" cy="142" r="10" fill="#f5efe3" stroke="#b8a888" stroke-width="1.5"/><line x1="975" y1="149" x2="989" y2="135" stroke="#b8a888" stroke-width="1.5"/><text x="1000" y="148">排线 = 推断</text></g>
    </g>
    <text x="972" y="280" font-size="18" fill="#6b6049" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">01 上海中心大厦</text>
    <text x="972" y="306" font-size="18" fill="#6b6049" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">九个垂直社区</text>
  </g>
</svg>
